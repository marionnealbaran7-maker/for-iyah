<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            /* PINK BACKGROUND */
            background:
                radial-gradient(circle at 20% 20%, #ffddeb 0%, transparent 25%),
                radial-gradient(circle at 80% 80%, #f7b6cf 0%, transparent 30%),
                linear-gradient(135deg, #ffd6e5, #f6aeca);

            overflow: hidden;
            position: relative;
        }


        /* BACKGROUND HEARTS */

        .heart {
            position: absolute;

            color: rgba(255, 255, 255, 0.55);

            font-size: 30px;

            animation: floatHeart 6s ease-in-out infinite;

            pointer-events: none;
        }

        .heart:nth-child(1) {
            left: 8%;
            top: 15%;
            font-size: 35px;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 85%;
            top: 12%;
            font-size: 25px;
            animation-delay: 1s;
        }

        .heart:nth-child(3) {
            left: 15%;
            top: 75%;
            font-size: 25px;
            animation-delay: 2s;
        }

        .heart:nth-child(4) {
            left: 88%;
            top: 70%;
            font-size: 40px;
            animation-delay: 3s;
        }

        .heart:nth-child(5) {
            left: 50%;
            top: 8%;
            font-size: 20px;
            animation-delay: 1.5s;
        }

        .heart:nth-child(6) {
            left: 5%;
            top: 45%;
            font-size: 20px;
            animation-delay: 2.5s;
        }

        .heart:nth-child(7) {
            left: 93%;
            top: 45%;
            font-size: 22px;
            animation-delay: 4s;
        }

        .heart:nth-child(8) {
            left: 70%;
            top: 88%;
            font-size: 28px;
            animation-delay: 3.5s;
        }


        @keyframes floatHeart {

            0%, 100% {
                transform: translateY(0) rotate(-10deg);
                opacity: 0.5;
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
                opacity: 1;
            }

        }


        /* SMALL DOTS */

        .dot {
            position: absolute;

            width: 12px;
            height: 12px;

            background: rgba(255, 255, 255, 0.5);

            border-radius: 50%;

            animation: pulse 3s ease-in-out infinite;
        }

        .dot:nth-child(9) {
            left: 25%;
            top: 12%;
        }

        .dot:nth-child(10) {
            left: 75%;
            top: 25%;
            width: 8px;
            height: 8px;
        }

        .dot:nth-child(11) {
            left: 12%;
            top: 60%;
            width: 9px;
            height: 9px;
        }

        .dot:nth-child(12) {
            left: 80%;
            top: 55%;
        }

        @keyframes pulse {

            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.8;
            }

        }


        /* MAIN CARD */

        .card {
            background: transparent;

            border: none;

            box-shadow: none;

            padding: 20px;

            text-align: center;

            z-index: 10;

            transition: 0.6s ease;
        }


        /* SNOOPY */

        .snoopy-img {
            width: 220px;

            height: auto;

            display: block;

            margin: 0 auto 15px;

            border: none;

            border-radius: 0;

            box-shadow: none;

            background: transparent;
        }


        /* HI BEBI */

        h1 {
            color: white;

            font-size: 1.8rem;

            margin-bottom: 20px;

            text-shadow:
                2px 2px 5px rgba(150, 70, 100, 0.25);
        }


        /* BUTTON */

        .press-btn {
            background: #d88099;

            color: white;

            border: none;

            padding: 12px 30px;

            font-size: 1rem;

            font-weight: bold;

            border-radius: 50px;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(180, 70, 110, 0.25);

            transition: 0.3s ease;
        }

        .press-btn:hover {
            background: #c46882;

            transform: scale(1.08);
        }


        /* HIDE */

        .card.hide {
            opacity: 0;

            transform: scale(0);

            pointer-events: none;
        }


        /* LOVE TEXT */

        .floating-text {
            position: absolute;

            bottom: -50px;

            color: #e85c91;

            font-weight: bold;

            text-shadow:
                2px 2px 4px white;

            pointer-events: none;

            white-space: nowrap;

            animation:
                floatUp 4s linear forwards;
        }


        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    scale(0.8);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-105vh)
                    scale(1.2);

                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND DESIGN -->

    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>

    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>


    <!-- MAIN CONTENT -->

    <div class="card" id="loveCard">


        <img
            src="snoopy.png"
            alt="Snoopy"
            class="snoopy-img"
        >


        <h1>
            hi bebi !
        </h1>


        <button
            class="press-btn"
            onclick="startLoveExplosion()"
        >
        press Me
        </button>


    </div>


    <script>


        function startLoveExplosion() {


            document
                .getElementById("loveCard")
                .classList
                .add("hide");


            /* 200 LOVE TEXTS */

            for (let i = 0; i < 200; i++) {


                setTimeout(function() {

                    createLoveText();

                }, i * 50);


            }

        }


        function createLoveText() {


            const text =
                document.createElement("div");


            text.classList.add(
                "floating-text"
            );


            text.innerText =
                "i love you so much!";


            /* RANDOM POSITION */

            text.style.left =
                Math.random() * 95 + "vw";


            /* RANDOM SIZE */

            text.style.fontSize =
                (Math.random() * 1.5 + 0.8)
                + "rem";


            /* RANDOM SPEED */

            const duration =
                Math.random() * 2 + 3;


            text.style.animationDuration =
                duration + "s";


            document.body.appendChild(
                text
            );


            /* REMOVE AFTER ANIMATION */

            setTimeout(function() {

                text.remove();

            }, duration * 1000);


        }


    </script>


</body>
</html>
